<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    body { margin:0; font-family:'IBM Plex Sans',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
    a { color:#6E1B2C; } a:hover { color:#8E2740; }
    .mono { font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; }
  </style>
</helmet>
<div style="width:390px;height:844px;background:#FCFAF9;color:#1A1518;display:flex;flex-direction:column;overflow:hidden">

  <div style="padding:16px 16px 12px;border-bottom:1px solid #E9E1DE">
    <span style="font-size:24px;font-weight:700;letter-spacing:-0.6px">Menü</span>
  </div>

  <!-- BAĞLAM · dükkan ve dönem BURADAN değiştirilir; bugün hiçbir yerde yok -->
  <div style="margin:14px 16px 0;background:#3F0F1B;border-radius:11px;padding:14px;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;align-items:center;gap:11px">
      <span style="width:34px;height:34px;border-radius:50%;background:#6E1B2C;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0">MK</span>
      <div style="display:flex;flex-direction:column;gap:1px;flex-grow:1;min-width:0">
        <span style="font-size:14px;font-weight:600;color:#F7EDEF">Mahmut Kaya</span>
        <span style="font-size:12px;color:#D98C9E">İşletme sahibi · İşler Yayınları</span>
      </div>
    </div>
    <div style="display:flex;gap:8px">
      <div style="flex-grow:1;display:flex;align-items:center;gap:7px;padding:10px 11px;background:#55172A;border-radius:8px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#F4E0E4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9M4 9h16v11H4z"/></svg>
        <div style="display:flex;flex-direction:column;gap:1px;flex-grow:1;min-width:0">
          <span style="font-size:9px;letter-spacing:0.6px;color:#C08A98">DÜKKAN</span>
          <span style="font-size:12px;font-weight:600;color:#F7EDEF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Karaköprü</span>
        </div>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#D98C9E" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div style="flex-grow:1;display:flex;align-items:center;gap:7px;padding:10px 11px;background:#55172A;border-radius:8px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#F4E0E4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <div style="display:flex;flex-direction:column;gap:1px;flex-grow:1;min-width:0">
          <span style="font-size:9px;letter-spacing:0.6px;color:#C08A98">DÖNEM</span>
          <span style="font-size:12px;font-weight:600;color:#F7EDEF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">2025-26 / 2</span>
        </div>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#D98C9E" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </div>
  </div>

  <div style="flex-grow:1;overflow:hidden;display:flex;flex-direction:column;gap:16px;padding:18px 16px 0">

    <!-- GRUPLU · eskiden 15 hedef tek düz listeydi -->
    <div style="display:flex;flex-direction:column;gap:2px">
      <span style="font-size:11px;font-weight:600;letter-spacing:0.8px;color:#8A7E82;padding:0 2px 6px">SATIŞ</span>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
        <div style="display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 6px;background:#fff;border:1px solid #E9E1DE;border-radius:10px">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#6E1B2C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/></svg>
          <span style="font-size:11px;font-weight:500;text-align:center">Siparişler</span>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 6px;background:#fff;border:1px solid #E9E1DE;border-radius:10px;position:relative">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#6E1B2C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
          <span style="font-size:11px;font-weight:500;text-align:center">Hazırlık</span>
          <span class="mono" style="position:absolute;top:8px;right:10px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#3E6E8E;color:#fff;font-size:9px;font-weight:600;display:flex;align-items:center;justify-content:center">4</span>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 6px;background:#fff;border:1px solid #E9E1DE;border-radius:10px">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#6E1B2C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h11v11"/><path d="M20 3L9 14"/><path d="M4 8v12h12"/></svg>
          <span style="font-size:11px;font-weight:500;text-align:center">Konsinye</span>
        </div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:2px">
      <span style="font-size:11px;font-weight:600;letter-spacing:0.8px;color:#8A7E82;padding:0 2px 6px">PARA</span>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
        <div style="display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 6px;background:#fff;border:1px solid #E9E1DE;border-radius:10px">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#6E1B2C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>
          <span style="font-size:11px;font-weight:500;text-align:center">Tahsilat</span>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 6px;background:#fff;border:1px solid #E9E1DE;border-radius:10px;position:relative">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#6E1B2C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
          <span style="font-size:11px;font-weight:500;text-align:center">Vadeler</span>
          <span class="mono" style="position:absolute;top:8px;right:10px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#B0332B;color:#fff;font-size:9px;font-weight:600;display:flex;align-items:center;justify-content:center">2</span>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 6px;background:#fff;border:1px solid #E9E1DE;border-radius:10px">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#6E1B2C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 3 6-7"/><path d="M3 21h18"/></svg>
          <span style="font-size:11px;font-weight:500;text-align:center">Raporlar</span>
        </div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:2px">
      <span style="font-size:11px;font-weight:600;letter-spacing:0.8px;color:#8A7E82;padding:0 2px 6px">DENEME</span>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
        <div style="display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 6px;background:#fff;border:1px solid #E9E1DE;border-radius:10px">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#6E1B2C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01"/></svg>
          <span style="font-size:11px;font-weight:500;text-align:center">Takvim</span>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 6px;background:#fff;border:1px solid #E9E1DE;border-radius:10px">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#6E1B2C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          <span style="font-size:11px;font-weight:500;text-align:center">Programlar</span>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 6px;background:#fff;border:1px solid #E9E1DE;border-radius:10px">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#6E1B2C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v18H6a2 2 0 0 1-2-1.5z"/></svg>
          <span style="font-size:11px;font-weight:500;text-align:center">Katalog</span>
        </div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:2px">
      <span style="font-size:11px;font-weight:600;letter-spacing:0.8px;color:#8A7E82;padding:0 2px 6px">ARAÇLAR</span>
      <div style="display:flex;flex-direction:column;background:#fff;border:1px solid #E9E1DE;border-radius:10px;overflow:hidden">
        <div style="display:flex;align-items:center;gap:11px;padding:12px 13px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5C5155" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
          <span style="font-size:13px;flex-grow:1">Senkron</span>
          <span style="font-size:11px;color:#8A7E82">12 dk önce</span>
        </div>
        <div style="height:1px;background:#F1EAE7"></div>
        <div style="display:flex;align-items:center;gap:11px;padding:12px 13px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5C5155" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M4 21h16v-6"/></svg>
          <span style="font-size:13px;flex-grow:1">Toplu aktarma</span>
        </div>
        <div style="height:1px;background:#F1EAE7"></div>
        <div style="display:flex;align-items:center;gap:11px;padding:12px 13px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5C5155" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H1a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 2.6 7"/></svg>
          <span style="font-size:13px;flex-grow:1">Ayarlar</span>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
